<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 220" width="1280" height="220" role="img" aria-label="62 confirmed findings, 11 PIN attempts checked, 4 years of research reviewed, 3 hackathon finales">
<style>.c{animation:up .8s ease-out backwards}@keyframes up{from{opacity:0;transform:translateY(12px)}}</style>
<defs><pattern id="st" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="14" height="28" fill="#e53a2d"/><rect x="14" width="14" height="28" fill="#f4efe3"/></pattern><clipPath id="bagc"><rect width="296" height="204" rx="10"/></clipPath></defs>
<g class="c" style="animation-delay:0.00s" transform="translate(8 8)"><rect width="296" height="204" rx="10" fill="#130f26" stroke="#c9b2ff" stroke-opacity=".4"/><g clip-path="url(#bagc)"><rect width="296" height="24" fill="url(#st)"/></g><text x="22" y="124" fill="#d9f4ff" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="88">62</text><text x="24" y="160" fill="#aaa4c8" font-family="'Helvetica Neue',Arial,sans-serif" font-size="16">confirmed findings on</text><text x="24" y="182" fill="#aaa4c8" font-family="'Helvetica Neue',Arial,sans-serif" font-size="16">one secure element</text></g>
<g class="c" style="animation-delay:0.15s" transform="translate(328 8)"><rect width="296" height="204" rx="10" fill="#130f26" stroke="#c9b2ff" stroke-opacity=".4"/><g clip-path="url(#bagc)"><rect width="296" height="24" fill="url(#st)"/></g><text x="22" y="124" fill="#d9f4ff" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="88">11</text><text x="24" y="160" fill="#aaa4c8" font-family="'Helvetica Neue',Arial,sans-serif" font-size="16">sequential PIN attempts</text><text x="24" y="182" fill="#aaa4c8" font-family="'Helvetica Neue',Arial,sans-serif" font-size="16">checked for key destruction</text></g>
<g class="c" style="animation-delay:0.30s" transform="translate(648 8)"><rect width="296" height="204" rx="10" fill="#130f26" stroke="#c9b2ff" stroke-opacity=".4"/><g clip-path="url(#bagc)"><rect width="296" height="24" fill="url(#st)"/></g><text x="22" y="124" fill="#d9f4ff" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="88">4</text><text x="24" y="160" fill="#aaa4c8" font-family="'Helvetica Neue',Arial,sans-serif" font-size="16">years of ransomware</text><text x="24" y="182" fill="#aaa4c8" font-family="'Helvetica Neue',Arial,sans-serif" font-size="16">research reviewed</text></g>
<g class="c" style="animation-delay:0.45s" transform="translate(968 8)"><rect width="296" height="204" rx="10" fill="#130f26" stroke="#c9b2ff" stroke-opacity=".4"/><g clip-path="url(#bagc)"><rect width="296" height="24" fill="url(#st)"/></g><text x="22" y="124" fill="#d9f4ff" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="88">3</text><text x="24" y="160" fill="#aaa4c8" font-family="'Helvetica Neue',Arial,sans-serif" font-size="16">hackathon finales</text><text x="24" y="182" fill="#aaa4c8" font-family="'Helvetica Neue',Arial,sans-serif" font-size="16">reached</text></g>
</svg>